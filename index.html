<html lang="en">

    <meta charset="UTF-8" />

    <!-- Fonts are self-hosted (see main.tsx's @fontsource imports) — no
         external stylesheet/font-host round trip needed anymore.

         loadGsiScript) so a returning reviewer with a still-valid stored
         token never pays for it. -->

    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <title>Document Review Portal</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
